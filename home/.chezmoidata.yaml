# Agent tooling profile shared by chezmoi (home/dot_claude) and Ansible (roles/agents).
# Lists are the desired state on a fresh machine; nothing here carries credentials.
agents:
  claude:
    marketplaces:
      - name: claude-plugins-official
        source: anthropics/claude-plugins-official
      - name: openai-codex
        source: openai/codex-plugin-cc
      - name: taste-skill
        source: leonxlnx/taste-skill
      - name: impeccable
        source: pbakaus/impeccable
      - name: ponytail
        source: DietrichGebert/ponytail
      - name: engram
        source: nagisanzenin/engram
      - name: diagram-design
        source: cathrynlavery/diagram-design
      - name: beautiful-rust
        source: morganlinton/BeautifulRust
      - name: samari
        # Local development bundle; registered only when this path exists.
        source_path: Documents/code/samari/dist/samari
    # Installable with `claude plugin install`. claude.ai "synced" plugins
    # (productivity, marketing, data, finance) follow the account, not this list.
    plugins:
      - aws-amplify@claude-plugins-official
      - chrome-devtools-mcp@claude-plugins-official
      - claude-code-setup@claude-plugins-official
      - claude-md-management@claude-plugins-official
      - code-review@claude-plugins-official
      - code-simplifier@claude-plugins-official
      - commit-commands@claude-plugins-official
      - context7@claude-plugins-official
      - databases-on-aws@claude-plugins-official
      - deploy-on-aws@claude-plugins-official
      - feature-dev@claude-plugins-official
      - frontend-design@claude-plugins-official
      - github@claude-plugins-official
      - hookify@claude-plugins-official
      - playwright@claude-plugins-official
      - pr-review-toolkit@claude-plugins-official
      - ralph-loop@claude-plugins-official
      - remember@claude-plugins-official
      - security-guidance@claude-plugins-official
      - skill-creator@claude-plugins-official
      - stripe@claude-plugins-official
      - superpowers@claude-plugins-official
      - typescript-lsp@claude-plugins-official
      - clangd-lsp@claude-plugins-official
      - rust-analyzer-lsp@claude-plugins-official
      - codex@openai-codex
      - taste-skill@taste-skill
      - impeccable@impeccable
      - ponytail@ponytail
      - engram@engram
      - diagram-design@diagram-design
      - beautiful-rust@beautiful-rust
      - samari@samari
    # Skills published without a plugin manifest, copied into ~/.claude/skills
    # by the `skills` CLI (pinned under npm below).
    skills:
      - name: archify
        source: tt-a1i/archify
    # Merged into ~/.claude/settings.json by modify_settings.json; other keys are preserved.
    settings:
      model: "opus"
      effortLevel: xhigh
      modelSettings:
        claude-fable-5-1:
          effortLevel: high
        claude-opus-5-5:
          effortLevel: xhigh
      tui: fullscreen
      skipDangerousModePermissionPrompt: true
      skipWorkflowUsageWarning: true
  codex:
    marketplaces:
      - name: samari
        source_path: Documents/code/samari/dist/samari
    plugins:
      - samari@samari
  npm:
    - name: "@colbymchenry/codegraph"
      version: "1.1.3"
    - name: promptfoo
      version: "0.121.17"
    # Omnigent needs pnpm with Node 22+, uv, git, tmux and, on Linux, bubblewrap.
    - name: pnpm
      version: "12.11.2"
    - name: skills
      version: "1.8.1"
    # Local usage reporter: estimates tokens and cost from each agent's own logs.
    # Report commands only; its statusline and hook features are not used.
    - name: ccusage
      version: "20.0.50"
  # An optional `os` (ansible_os_family) limits an entry to one platform.
  pipx:
    - name: graphifyy
      version: "0.7.9"
    - name: omnigent
      version: "0.18.0"
    # Static scanner for agent skill packages; its default analyzers need no key or network.
    - name: cisco-ai-skill-scanner
      version: "2.3.2"
    # macOS gets uv from Homebrew.
    - name: uv
      version: "0.13.1"
      os: Debian
  peon_ping:
    enabled: true

# Local open-weight models for an explicit, operator-started session. Nothing
# here changes a default: agents.claude.settings.model above is untouched, and
# no tool switches to these models on its own. The launchers ~/.local/bin/
# claude-local and codex-local read this block and refuse to start when the
# runtime does not answer or the model is not pulled.
local_models:
  runtime:
    name: ollama
    brew: ollama
    endpoint: "http://127.0.0.1:11434"
    # The server must be started with this context length (see the README).
    context_length: 64000
  default: qwen
  # A list, so a second family can be added for a reviewer. One loads at a time.
  families:
    - name: qwen
      tag: "qwen3-coder-next:q4_K_M"
  # No gateway: the runtime serves both hosts' wire formats itself.
  gateway: ""

# Defensive security scanners, installed by the `security` role (macOS now;
# Ubuntu is wired during the full-setup test). Mainstream tools, no credentials;
# each scanner's exact version is recorded when it runs, not pinned here.
security:
  scanners:
    - name: semgrep       # static analysis (SAST)
      brew: semgrep
    - name: osv-scanner   # dependency and lockfile known-vulnerability checks
      brew: osv-scanner
    - name: gitleaks      # secret scanning in code and history
      brew: gitleaks
    - name: trivy         # container, IaC and configuration checks
      brew: trivy
    - name: zizmor        # GitHub Actions workflow security audit
      brew: zizmor
    - name: actionlint    # GitHub Actions workflow correctness lint
      brew: actionlint
